# benchmarks/real_repo/repos.toml — ADR-019 pinned public corpus manifest.
#
# The real-repo retrieval eval indexes THESE repositories, at THESE exact commits,
# with the production indexer, then grades the real HybridRetriever against the
# hand-authored fixtures in benchmarks/real_repo/fixtures/. Pinning by commit SHA
# makes the scorecard reproducible and auditable — anyone can clone the same code
# and re-grade (ADR-019 §1, the moat's "inspectable number").
#
# Selection (ADR-019 §1, reviewer-approved 2026-07-01): permissive license, a real
# cross-symbol call graph (not single-file utils or pure type/header libs), moderate
# size (indexes in minutes), and deliberately NOT ultra-famous, to limit — never
# eliminate — training-data contamination (§8; the private slice §6 is the control).
#
# Each repo is pinned to its latest stable RELEASE tag's commit (more meaningful and
# stable than a moving default-branch HEAD). tools/real_repo_prepare.py clones at
# `sha` into a git-ignored working dir; only this manifest + the fixtures are committed.

