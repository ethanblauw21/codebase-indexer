# indexer.toml — Per-repo configuration for the code indexer.
#
# Copy or symlink this file to each repository root you want to index,
# then edit the values below.  All paths are relative to the directory
# where this file lives (the repo root).
#
# Install with:  pip install -e /path/to/indexer
# Run indexer:   code-indexer
# Run MCP server: code-indexer-serve

[indexer]
# Root of the repository to index (relative or absolute).
repo_root = "."

# Directory where FAISS indexes and graph.db are stored.
index_dir = ".code-index"

# Optional: path to a rules.yaml file for risk analysis.
# When absent, no rules are applied (copy examples/firebase-rules.yaml).
# rules_file = "rules.yaml"

[embeddings]
# HuggingFace model ID for code embeddings. Read by src/core.py (ADR-009 §P1) and
# by the eval harness, so a single change here swaps the embedder everywhere.
#
# CHANGING THE EMBEDDER IS A ONE-TIME REINDEX. A new model usually has a different
# vector dimension; the FAISS indexes are created at a fixed dimension, so you must
# update `dimension` to match AND rebuild: delete .code-index and run code-indexer.
# stable_ids are model-independent, so the rebuild is recompute-vectors-only (no
# schema change). core.py refuses to load an index whose dimension no longer matches.
#
# Prior proven Wave-0 baseline: jinaai/jina-embeddings-v2-base-code (768 dims).
# ADR-009 §P1 default (VALIDATED 2026-07-07): BAAI/bge-code-v1 ("CodeR",
# Qwen2.5-Coder-1.5B backbone) — CoIR 81.77 vs jina 59.56, Apache-2.0, ~3GB fp16
# (fits the T4). Confirmed on the real-repo dense arm (n=148, T4): pooled +0.062
# mrr@10 / +0.065 ndcg@10 vs the jina baseline, winning 4/5 languages (C# +0.197
# the standout). See ADR-009 §P1 for the full table. Revert both values to the jina
# pair above only if a future run overturns this.
model_id = "BAAI/bge-code-v1"

# Maximum sequence length fed to the embedding model. Held at 512 for a clean A/B
# vs the jina baseline (swap only the embedder, not the chunk length). bge-code-v1
# supports 32k, but the largest chunk we emit is tier-3 (~4000 tok), so the only
# meaningful raise is to ~4096 (fully embeds tier-2/3 instead of truncating them) —
# a SEPARATE follow-up experiment on the T4, logged in ADR-009 §P1. Reduce if you
# hit OOM on GPUs with less than 8 GB VRAM.
max_seq_length = 512

# Output embedding dimension. MUST match the model AND the built FAISS indexes;
# change it together with model_id and reindex (see above). bge-code-v1 hidden_size.
dimension = 1536

# Query-side instruction prefix (ADR-009 §P1). bge-code-v1 wraps QUERIES as
# "<instruct>{query_instruct}\n<query>{text}"; DOCUMENTS get no prefix, so only the
# query path (core.embed) is affected — bulk indexing (embed_batch) is untouched.
# Empty string = no wrapping (the jina behavior). Read by src/core.py.
query_instruct = "Given a code search query, retrieve relevant code that answers it"

[reranker]
# Reranker for cross-encoder rescoring of dense candidates (optional).
#
# Qwen3-Reranker-0.6B: Apache-2.0, ungated, ~0.6B params, strong on code
# retrieval. NOTE it is a causal-LM yes/no scorer, NOT a sentence-transformers
# CrossEncoder — the eval harness (tools/coir_eval.py load_reranker) loads it via
# the Qwen3 logit-scoring path. (The prior value `jina-reranker-v2-base-code` was
# a non-existent model id; it is gone.)
#
# Read by BOTH the eval harness and the production retriever
# (src/hybrid_retriever.py, via src/config.py + src/reranker.py).
#
# No manual pre-download needed: the calibration launcher (run_reranker_calibrate)
# fetches it online on first run, then the offline long run reuses the cache.
model_id = "Qwen/Qwen3-Reranker-0.6B"

# Production reranking is OFF by default (ADR-009 §P4). When false, the retriever
# returns the RRF-ranked top-10 — the measured Wave-0 baseline (ADR-007), not a
# degraded fallback. Reranker lift on CoIR was neutral (cosqa) to negative
# (codefeedback-mt); leave this false until the internal-repo eval shows a win.
# The eval harness ignores this flag — it reranks whenever --config dense+reranker.
enabled = false

[retrieval]
# Fusion of the dense (multi-tier FAISS RRF) and sparse (BM25) retrieval signals
# in src/hybrid_retriever.py (ADR-009 §P3).
#
#   "rrf"    — dense-only multi-tier RRF. The DEFAULT and the measured Wave-0
#              behavior (ADR-007); no BM25 index is built, so zero added cost.
#   "convex" — score-normalized weighted combination of dense + BM25 sparse signal.
#              Catches exact-identifier / rare-token matches dense retrieval blurs.
#              Builds an in-memory BM25 index over all chunks at startup (RAM +
#              startup cost that scales with corpus size).
#
# Stays "rrf" until the ADR-007 harness shows convex beats the dense baseline
# (ADR-009 validation contract — off by default until a measured lift).
fusion_mode = "rrf"

# Weights for the convex combination (used only when fusion_mode = "convex").
# Expressed as a ratio — renormalized to sum to 1 internally. These are the
# parameters ADR-014 will later learn from usage.
dense_weight = 0.7
sparse_weight = 0.3

[summarization]
# Set to false to skip LLM chunk summarization (faster indexing, lower recall).
enabled = true

# HuggingFace model ID for chunk summarization.
# Use "Qwen/Qwen2.5-Coder-7B-Instruct" for higher quality on GPU.
#
# Pre-download before first use:
#   huggingface-cli download Qwen/Qwen2.5-Coder-1.5B-Instruct
#
model_id = "Qwen/Qwen2.5-Coder-1.5B-Instruct"

[eval]
# ADR-007 — CoIR retrieval benchmark harness (Wave-0 baseline).
# Data is materialized into benchmarks/coir/<subtask>/ by tools/coir_prepare.py;
# the harness (tools/coir_eval.py) indexes CoIR's OWN corpus atomically (§7) and
# grades returned doc-ids against the committed qrels — it never reads .code-index.

# Wave-0 core set (§2): the primary-language subtasks (Python + JavaScript overlap).
# C#/C++ have no CoIR coverage (§9) — covered later by the internal-repo eval.
subtasks = [
    "cosqa",
    "stackoverflow-qa",
    "codefeedback-mt",
    "CodeSearchNet-python",
    "CodeSearchNet-javascript",
]

# Atomic-doc projection is the Wave-0 baseline (§7); chunk-tier projection is the
# deferred, separately-reported path.
tier_projection = "atomic"

# Pipeline configs baselined (§8): "dense" (embedder alone) is the minimum run;
# "dense+reranker" is the heavier follow-on (priced separately, core set only).
configs = ["dense", "dense+reranker"]

# §1 token-economy budget-adherence threshold (returned top-k context tokens).
budget_tokens = 8000

# §8 dense+reranker depth: dense retrieves this many candidates, the cross-encoder
# rescores them, top-K is graded. Cost scales with queries x rerank_depth (NOT corpus
# size), so this is the main lever on reranker wall-clock. 100 is the published default;
# 50 roughly halves rerank time for near-identical quality (reranking rarely rescues a
# doc dense buried below rank 50). Ignored by the dense-only config.
rerank_depth = 100

# §8 reranker feasibility — Qwen3-Reranker on CPU is ~0.3 s/pair, so reranking ALL
# queries x depth would take ~12 days. For the dense+reranker baseline we score a
# SEEDED RANDOM sample of this many gradable queries per subtask (0 = all). Sampling
# is statistically unbiased: it widens each score's confidence interval (reported in
# the scorecard) but does NOT shift the score. The reranker's LIFT is measured paired
# on the same sampled queries, so the comparison stays precise even at n=500.
# The dense baseline is unaffected — it always runs all queries (full precision).
# 500/subtask x 5 x depth 100 ~= 21 h; set to 0 for the full multi-day run.
rerank_sample_queries = 500

# §P3 sparse-fusion feasibility — the dense+sparse arm scores the FULL BM25 corpus in
# pure Python on every query (rank_bm25), so per-query cost scales with corpus size:
# ~16 s/query at 66k docs, more at 280k (CSN-python). Running all ~15k CSN-python queries
# is a multi-day CPU job. Like the reranker, we score a SEEDED RANDOM sample of this many
# gradable queries per subtask (0 = all). The sparse lift is measured PAIRED on the same
# sampled queries, so the comparison stays precise (tight lift CI) even at n=500. The dense
# baseline is unaffected (always full precision). Shares sample_seed below for reproducibility.
sparse_sample_queries = 500

# Seed for the reranker query sample — fixes which queries are drawn so a re-run under
# the same stack reproduces the exact baseline (§6 comparability).
sample_seed = 13

# Fast CI subset (§3): regression tripwire on retrieval-path changes, not publishable.
ci_subtasks = ["cosqa"]
ci_limit_queries = 50

# Append-structured baseline, one record per (subtask × config), git-SHA stamped (§6).
baseline_path = "benchmarks/baseline.jsonl"

[ignore]
# Directories to skip at any depth during disk scan.
dirs = [
    ".next", "node_modules", "dist", ".git", "build",
    ".code-index", ".continue", ".claude", ".vs", ".vscode",
    "Modelfiles", "playwright-report", "test-results",
    ".github", ".firebase", ".idx", "genkit", "indexer", "public", "mocks",
]

# Directories to skip only at the repository root.
root_dirs = ["functions"]

# File extensions to index.
extensions = [".py", ".ts", ".tsx", ".js", ".jsx"]
