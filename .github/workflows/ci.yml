name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push to a PR cancels its superseded run (a rebase used to run both).
# Pushes to master are never cancelled: each merge gets its own complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8 pyflakes

      - name: Run flake8
        run: |
          flake8 src \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E221,E251,E402,E701,E501,E302,E305 \
            --exclude=src/__pycache__,src/tui/__pycache__

  test:
    name: Test + Mutate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      # A collection error means no test ran at all, so fail here, before the run.
      # Master's check went green over `Interrupted: 2 errors during collection`
      # because the step below swallows everything (B-036).
      - name: Collect tests (blocking)
        run: pytest --co -q

      # `shell: bash` adds pipefail, so pytest's exit code survives the pipe into tee.
      # continue-on-error only lets the summary step run (ADR-004); that step reads
      # pytest_output.txt and fails the job on any failed or errored test.
      - name: Run pytest
        shell: bash
        run: pytest --tb=short -q 2>&1 | tee pytest_output.txt
        continue-on-error: true

      - name: Run mutmut
        run: |
          mutmut run \
            --paths-to-mutate src/stable_id.py,src/ast_chunker.py,src/incremental_indexer.py \
            --runner "python -m pytest tests/ -x -q --no-header --timeout=30"
        continue-on-error: true

      - name: Write CI summary and enforce thresholds
        if: always()
        run: python tools/ci_summary.py --threshold-high 90 --threshold-low 80

  conformance-scorecard:
    name: Extraction conformance (ADR-008 §1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      # Pure tree-sitter parse — no embedder, no HF download, runs in seconds.
      # Prints the per-language precision/recall table, then fails the build if any
      # metric dropped below the committed benchmarks/conformance/baseline.json.
      - name: Run extraction conformance scorecard
        run: python tools/conformance_eval.py --check-baseline

  resolution-scorecard:
    name: Resolution conformance (ADR-011 §4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      # The referee for ADR-011: index each C#/C++ fixture through the real pipeline
      # (parse -> upsert -> resolve) twice — with the receiver-type hint (ADR-011) and with
      # it stripped (ADR-021) — and fail the build unless the typed resolution rate is above
      # the name-only baseline with precision held at 1.0. Pure tree-sitter + SQLite, no
      # embedder, no GPU; runs in seconds.
      - name: Run resolution conformance scorecard
        run: python tools/resolution_eval.py --check-baseline

  l5x-table-integrity:
    name: L5X operand-role table integrity (ADR-013 §5.1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e ".[dev]"

      # These two are CHECKS, not diagnostics. The distinction matters (ADR-013
      # §5.5): the surveys under tools/l5x/ are exploratory instruments and are
      # deliberately not run here, because finding something new is not a pass/fail
      # condition. These two are pass/fail.
      #
      # A role-table entry silently becoming wrong is exactly the failure they exist
      # to catch, and it does not announce itself: a wrong role drops an operand out
      # of the denominator rather than failing to resolve, so extraction degrades
      # while every headline metric holds steady.
      #
      # Both are corpus-free — they run against the committed synthetic fixtures and
      # against the table's own internal invariants. No embedder, no GPU, seconds.
      - name: Fixture teeth — every correction must have a guard that can fail
        run: python tools/l5x_fixture_teeth.py --check

      - name: L5X adapter guards
        run: python -m pytest tests/test_l5x_adapter.py -q
