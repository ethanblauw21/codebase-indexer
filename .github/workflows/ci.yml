name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8 pyflakes

      - name: Run flake8
        run: |
          flake8 src \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E221,E251,E402,E701,E501,E302,E305 \
            --exclude=src/__pycache__,src/tui/__pycache__

  test:
    name: Test + Mutate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --tb=short -q 2>&1 | tee pytest_output.txt
        continue-on-error: true

      - name: Run mutmut
        run: |
          mutmut run \
            --paths-to-mutate src/stable_id.py,src/ast_chunker.py,src/incremental_indexer.py \
            --runner "python -m pytest tests/ -x -q --no-header --timeout=30"
        continue-on-error: true

      - name: Write CI summary and enforce thresholds
        if: always()
        run: python tools/ci_summary.py --threshold-high 90 --threshold-low 80
