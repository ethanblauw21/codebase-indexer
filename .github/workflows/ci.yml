name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8 pyflakes

      - name: Run flake8
        run: |
          flake8 indexer/src \
            --max-line-length=120 \
            --extend-ignore=E203,W503 \
            --exclude=indexer/src/__pycache__,indexer/src/tui/__pycache__
