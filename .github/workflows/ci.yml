name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install flake8 pyflakes

      - name: Run flake8
        run: |
          flake8 src \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E221,E251,E402,E701,E501,E302,E305 \
            --exclude=src/__pycache__,src/tui/__pycache__

  test:
    name: Test + Mutate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --tb=short -q 2>&1 | tee pytest_output.txt
        continue-on-error: true

      - name: Run mutmut
        run: |
          mutmut run \
            --paths-to-mutate src/stable_id.py,src/ast_chunker.py,src/incremental_indexer.py \
            --runner "python -m pytest tests/ -x -q --no-header --timeout=30"
        continue-on-error: true

      - name: Write CI summary and enforce thresholds
        if: always()
        run: python tools/ci_summary.py --threshold-high 90 --threshold-low 80

  retrieval-tripwire:
    name: Retrieval tripwire (ADR-019 §7)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      # The embedder is deterministic; cache it so only the first run (or a model-id
      # bump) pays the download.
      #
      # The key is DERIVED from indexer.toml, not written by hand. Hardcoded, it named
      # jina-embeddings-v2-base-code for the twenty-one days after ADR-009 §P1 promoted
      # BAAI/bge-code-v1 (2026-07-07) — so the cache never held the model the tripwire
      # actually loads, and every run re-downloaded ~3 GB under a name describing a
      # model that had left. Same defect class as ADR-026: a knob whose value the code
      # does not read. Do not replace this with a literal.
      - name: Resolve the embedder being cached
        id: embedder
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re, tomllib
          cfg = tomllib.loads(pathlib.Path("indexer.toml").read_text(encoding="utf-8"))
          model = cfg["embeddings"]["model_id"]
          print("model_id=" + re.sub(r"[^A-Za-z0-9._-]", "-", model))
          PY

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ steps.embedder.outputs.model_id }}

      # One small repo (p-queue), arm B only, committed MRR@10 floor. Self-prepares
      # (clone at pinned SHA + production index), then fails the build if retrieval
      # collapsed below the floor. Fast regression guard, not a publishable number.
      - name: Run real-repo retrieval tripwire
        run: python tools/real_repo_tripwire.py

  conformance-scorecard:
    name: Extraction conformance (ADR-008 §1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      # Pure tree-sitter parse — no embedder, no HF download, runs in seconds.
      # Prints the per-language precision/recall table, then fails the build if any
      # metric dropped below the committed benchmarks/conformance/baseline.json.
      - name: Run extraction conformance scorecard
        run: python tools/conformance_eval.py --check-baseline

  resolution-scorecard:
    name: Resolution conformance (ADR-011 §4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: pip install -e .

      # The referee for ADR-011: index each C#/C++ fixture through the real pipeline
      # (parse -> upsert -> resolve) twice — with the receiver-type hint (ADR-011) and with
      # it stripped (ADR-021) — and fail the build unless the typed resolution rate is above
      # the name-only baseline with precision held at 1.0. Pure tree-sitter + SQLite, no
      # embedder, no GPU; runs in seconds.
      - name: Run resolution conformance scorecard
        run: python tools/resolution_eval.py --check-baseline
