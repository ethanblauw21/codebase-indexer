[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-indexer"
version = "0.1.0"
description = "Local code intelligence engine: FAISS + SQLite hybrid indexer with MCP server"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu",
    # Pinned to a validated pair. Originally 5.5.0 / 4.53.3, because the jina embedder's
    # trust_remote_code modeling code imports transformers internals removed after 4.53.x
    # ("cannot import name find_pruneable_heads_and_indices"); jina is now only the
    # hardcoded model in the legacy tools/eval_retrieval.py. 2026-11-23: 5.7.0 / 4.57.6
    # give bit-identical bge-code-v1 embeddings and Qwen3 reranker scores on CPU.
    # transformers 5.x + sentence-transformers 6.x fail to load bge-code-v1
    # ("Unrecognized processing class"), so the majors are held.
    "sentence-transformers==5.7.0",
    "transformers==4.57.6",
    # The summarizer loads with device_map, which transformers refuses without
    # accelerate; it is only imported then, so its absence surfaced as empty summaries.
    "accelerate",
    "numpy",
    "tree-sitter>=0.21",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-c-sharp",
    "tree-sitter-cpp",
    "mcp[cli]>=1.28,<2",  # 2.x removed mcp.server.fastmcp (B-036)
    "watchdog",
    "textual",
    "rich",
    "pyyaml",
    "networkx>=3.0",
]

[project.scripts]
code-indexer       = "incremental_indexer:main"
code-indexer-serve = "MCPServer:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "ast_chunker",
    "category_tagger",
    "core",
    "db",
    "graph_analytics",
    "graph_report",
    "graph_viz",
    "hybrid_retriever",
    "import_resolver",
    "incremental_indexer",
    "iterative_retriever",
    "MCPServer",
    "RecFileSearch",
    "stable_id",
    "summarizer",
    "utf8_stdio",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "mutmut",
]
# Leiden community-detection backend (ADR-006 §4). Optional: graph_analytics
# falls through to NetworkX Louvain when these are absent. Native build deps.
leiden = ["leidenalg", "python-igraph"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]
